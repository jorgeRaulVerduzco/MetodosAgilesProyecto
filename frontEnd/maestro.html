<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ITSON - Portal Maestro</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
  </head>
  <body>
    <script src="auth.js"></script>
    <script>
      // Redirigir inmediatamente a gestión de cursos (esta página es solo un redirect)
      // Evitar bucles verificando que no estemos ya en la página destino
      const usuario = JSON.parse(localStorage.getItem('usuario') || 'null');
      const token = localStorage.getItem('token');
      
      if (token && usuario && usuario.tipoUsuario === 'maestro') {
        // Redirigir solo si no estamos ya en gestion_cursos
        if (!window.location.href.includes('gestion_cursos.html')) {
          window.location.replace('gestion_cursos.html');
        }
      } else if (token && usuario && usuario.tipoUsuario === 'alumno') {
        window.location.replace('index.html');
      } else {
        window.location.replace('login.html');
      }
    </script>
  </body>
</html>
