<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Diagnóstico</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 0;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container { 
            max-width: 450px; 
            width: 90%;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .icon-header {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .icon-header::before {
            content: "🎓";
            font-size: 40px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin: 10px 0 5px 0;
            font-size: 24px;
            font-weight: 600;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input { 
            width: 100%; 
            padding: 14px; 
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            transition: all 0.3s;
            background-color: #f8f9fa;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
        }
        .credentials-info {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        .credentials-info h4 {
            margin: 0 0 12px 0;
            color: #333;
            font-size: 14px;
        }
        .credentials-info p {
            margin: 6px 0;
            font-size: 13px;
            color: #555;
            font-family: 'Courier New', monospace;
        }
        .credentials-info strong {
            color: #667eea;
        }
        .log { 
            background: #f0f0f0; 
            padding: 15px; 
            margin-top: 15px; 
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
        }
        .error { 
            background: #ffebee; 
            color: #c62828;
            border-left: 4px solid #c62828;
        }
        .success { 
            background: #e8f5e9; 
            color: #2e7d32;
            border-left: 4px solid #2e7d32;
        }
        .info {
            background: #e3f2fd;
            color: #1565c0;
            border-left: 4px solid #1565c0;
        }
        .debug {
            background: #fff3e0;
            color: #e65100;
            border-left: 4px solid #e65100;
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        pre {
            margin: 5px 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-header"></div>
        <h2>ITSON</h2>
        <p class="subtitle">Sistema de Asistencias</p>

        <label for="usuario">ID ITSON</label>
        <input type="text" id="usuario" placeholder="00000212345" value="">
        
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" value="">

        <button onclick="iniciarSesion()">Iniciar Sesión</button>

        <div class="credentials-info">
            <h4>Credenciales de prueba:</h4>
            <p><strong>Alumno:</strong> ID: 00000212345 | Pass: alumno123</p>
            <p><strong>Maestro:</strong> ID: 00000298765 | Pass: maestro123</p>
        </div>

        <div id="resultado"></div>
        <div id="debug"></div>
    </div>

    <script>
        const API_URL = "http://localhost:3002";

        function mostrarMensaje(tipo, titulo, contenido) {
            const resultDiv = document.getElementById("resultado");
            resultDiv.className = `log ${tipo}`;
            resultDiv.innerHTML = `<strong>${titulo}</strong><br>${contenido}`;
        }

        function mostrarDebug(info) {
            const debugDiv = document.getElementById("debug");
            debugDiv.className = "log debug";
            debugDiv.innerHTML = `<strong>🐛 Información de Debug:</strong><pre>${JSON.stringify(info, null, 2)}</pre>`;
        }

        async function iniciarSesion() {
            const usuario = document.getElementById("usuario").value.trim();
            const password = document.getElementById("password").value.trim();

            if (!usuario || !password) {
                mostrarMensaje("error", "⚠️ Campos vacíos", 
                    "Por favor ingrese usuario y contraseña");
                return;
            }

            mostrarMensaje("info", "⏳ Autenticando...", "Enviando credenciales al servidor");

            try {
                const body = {
                    id: usuario,
                    contrasenia: password
                };

                mostrarDebug({
                    endpoint: `${API_URL}/api/login`,
                    method: "POST",
                    body: body
                });

                const res = await fetch(`${API_URL}/api/login`, {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(body)
                });

                const data = await res.json();
                
                mostrarDebug({
                    endpoint: `${API_URL}/api/login`,
                    status: res.status,
                    statusText: res.ok ? "OK" : "Error",
                    respuesta: data
                });

                if (data.success) {
                    mostrarMensaje("success", "✅ Login exitoso", 
                        `Bienvenido ${usuario}!<br>
                        ${data.token ? `Token: ${data.token.substring(0, 30)}...` : ''}<br>
                        Redirigiendo...`);
                    
                    // Guardar datos en sessionStorage (compatible con index.html)
                    sessionStorage.setItem('token', data.token);
                    sessionStorage.setItem('usuario', usuario);
                    sessionStorage.setItem('tipoUsuario', data.tipoUsuario || 'alumno');
                    sessionStorage.setItem('nombreUsuario', data.nombre || usuario);
                    
                    // También guardar en localStorage para la página de registro de asistencia
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('alumnoId', usuario);
                    
                    document.getElementById("password").value = "";
                    
                    // Redirigir después de 1 segundo
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                    
                } else {
                    mostrarMensaje("error", "❌ Login fallido", 
                        data.message || "Credenciales inválidas");
                }
            } catch (error) {
                mostrarDebug({
                    endpoint: `${API_URL}/api/login`,
                    error: error.message,
                    tipo: error.name
                });
                
                mostrarMensaje("error", "❌ Error de conexión", 
                    `No se pudo conectar con el servidor.<br><br>
                    Error: ${error.message}`);
            }
        }

        document.getElementById("password").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                iniciarSesion();
            }
        });

        document.getElementById("usuario").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                document.getElementById("password").focus();
            }
        });
    </script>
</body>
</html>
