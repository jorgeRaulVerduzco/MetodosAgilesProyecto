<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ITSON - Historial General de Asistencias</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <div class="header-content">
        <span class="portal-title">ITSON - Portal Maestro</span>
        <span class="user-name" id="userName">Cargando...</span>
      </div>
      <button class="logout-btn" onclick="cerrarSesion()">
        <span class="material-icons">exit_to_app</span>
        Cerrar Sesión
      </button>
    </header>

    <div class="main-container">
      <nav class="tabs">
        <a href="gestion_cursos.html" class="tab active">Mis cursos</a>
      </nav>

      <section class="attendance-summary-grid">
        <h2 class="section-title">Mis cursos</h2>
        <p class="section-subtitle">Periodo: Agosto - Diciembre 2025</p>

        <div id="loading" style="text-align: center; padding: 40px">
          <p>Cargando cursos...</p>
        </div>

        <div
          id="errorContainer"
          style="display: none; text-align: center; padding: 40px"
        >
          <span class="material-icons" style="font-size: 64px; color: #fc8181"
            >error_outline</span
          >
          <p id="errorMessage" style="margin-top: 16px; color: #c53030"></p>
        </div>

        <div
          class="subject-cards-grid"
          id="cardsContainer"
          style="display: none"
        ></div>

        <div
          id="sinCursosContainer"
          style="display: none; text-align: center; padding: 40px"
        >
          <span class="material-icons" style="font-size: 64px; color: #cbd5e0"
            >school</span
          >
          <p id="sinCursosMensaje" style="margin-top: 16px; color: #718096; font-size: 1.1em;"></p>
        </div>
      </section>
    </div>

    <script src="auth.js"></script>
    <script>
      const usuario = verificarAutenticacion();
      if (!usuario || usuario.tipoUsuario !== 'maestro') {
        // Usar replace para evitar bucles en el historial
        window.location.replace('login.html');
        // Detener ejecución si no hay usuario válido
        throw new Error('Usuario no autenticado');
      }

      document.getElementById("userName").textContent = `${usuario.nombres || ""} ${usuario.apellidos || ""}`.trim();

      async function cargarCursos() {
        try {
          const maestroId = usuario.id;
          const data = await fetchAuth(`/maestros/${maestroId}/cursos`);

          console.log("Respuesta del servidor:", data);

          if (!data) {
            mostrarError("No se recibió respuesta del servidor");
            return;
          }

          // Manejar diferentes formatos de respuesta
          let cursos = [];
          if (data.success && Array.isArray(data.data)) {
            cursos = data.data;
          } else if (Array.isArray(data)) {
            cursos = data;
          } else if (data.data && Array.isArray(data.data)) {
            cursos = data.data;
          } else if (data.cursos && Array.isArray(data.cursos)) {
            cursos = data.cursos;
          }

          // Escenario 2: Maestro sin cursos
          if (data.message && data.message.includes("No tienes cursos")) {
            mostrarSinCursos(data.message);
            return;
          }

          if (cursos.length === 0) {
            mostrarSinCursos("No tienes cursos asignados en este periodo");
            return;
          }

          console.log("Cursos a mostrar:", cursos);
          mostrarCursos(cursos);
        } catch (err) {
          console.error("Error cargando cursos:", err);
          mostrarError("Error al obtener los cursos: " + (err.message || "Error desconocido"));
        }
      }

      function mostrarSinCursos(mensaje) {
        const loading = document.getElementById("loading");
        const cardsContainer = document.getElementById("cardsContainer");
        const errorContainer = document.getElementById("errorContainer");

        loading.style.display = "none";
        errorContainer.style.display = "none";
        cardsContainer.style.display = "grid";
        cardsContainer.innerHTML = `
          <div style="grid-column:1/-1; text-align:center; padding:40px;">
            <span class="material-icons" style="font-size:64px; color:#cbd5e0;">school</span>
            <p style="margin-top:16px; color:#718096; font-size:1.1em;">${mensaje}</p>
          </div>`;
      }

      function mostrarCursos(cursos) {
        const loading = document.getElementById("loading");
        const cardsContainer = document.getElementById("cardsContainer");
        const errorContainer = document.getElementById("errorContainer");

        loading.style.display = "none";
        errorContainer.style.display = "none";

        if (!Array.isArray(cursos) || cursos.length === 0) {
          cardsContainer.innerHTML = `
            <div style="grid-column:1/-1; text-align:center; padding:40px;">
              <span class="material-icons" style="font-size:64px; color:#cbd5e0;">school</span>
              <p style="margin-top:16px; color:#718096;">No tienes cursos registrados aún</p>
            </div>`;
          cardsContainer.style.display = "grid";
          return;
        }

        cardsContainer.innerHTML = cursos
          .map((curso) => {
            // Acceder correctamente a los datos anidados
            const materiaNombre = curso.materia?.nombre || curso.nombre || "Sin nombre";
            const grupo = curso.grupo || "Grupo 01";
            const dia = curso.horario?.dia || "-";
            const horaInicio = curso.horario?.horaInicio || "";
            const horaFin = curso.horario?.horaFin || "";
            const edificio = curso.salon?.edificio || "";
            const aula = curso.salon?.aula || "";
            const alumnos = curso.alumnosCount || 0;
            const cursoId = curso.id || "";

            return `
              <div class="subject-card">
                <div>
                  <h3 class="card-title">${materiaNombre}</h3>
                  <div class="group-label">${grupo}</div>

                  <div class="card-detail">
                    <span class="material-icons">event</span>
                    <span class="detail-label">Días:</span>
                    <span class="detail-value">${dia}</span>
                  </div>
                  <div class="card-detail">
                    <span class="material-icons">schedule</span>
                    <span class="detail-label">Horario:</span>
                    <span class="detail-value">${horaInicio && horaFin ? `${horaInicio} - ${horaFin}` : "No disponible"}</span>
                  </div>
                  <div class="card-detail">
                    <span class="material-icons">place</span>
                    <span class="detail-label">Ubicación:</span>
                    <span class="detail-value">${edificio ? `Edificio ${edificio}` : ""}${aula ? `, Aula ${aula}` : ""}</span>
                  </div>
                  <div class="card-detail">
                    <span class="material-icons">people</span>
                    <span class="detail-label">Alumnos:</span>
                    <span class="detail-value">${alumnos} alumnos</span>
                  </div>
                </div>

                <div>
                  <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
                    <a class="details-link" href="consultar_asistencia_maestro.html?cursoId=${cursoId}">Ver asistencias →</a>
                  </div>
                </div>
              </div>`;
          })
          .join("");

        cardsContainer.style.display = "grid";
      }

      function mostrarError(mensaje) {
        document.getElementById("loading").style.display = "none";
        document.getElementById("errorMessage").textContent = mensaje;
        document.getElementById("errorContainer").style.display = "block";
      }

      window.addEventListener("load", cargarCursos);
    </script>
  </body>
</html>
